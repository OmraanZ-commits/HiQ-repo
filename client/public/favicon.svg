<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Globe circle -->
  <circle cx="32" cy="32" r="28" fill="#1A3C6E" stroke="#2563EB" stroke-width="2"/>
  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="28" ry="10" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="32" cy="32" rx="28" ry="20" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="10" ry="28" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.7"/>
  <ellipse cx="32" cy="32" rx="20" ry="28" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
  <!-- Center meridian -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#60A5FA" stroke-width="1.5" opacity="0.6"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#60A5FA" stroke-width="1.5" opacity="0.6"/>
  <!-- Network nodes -->
  <circle cx="32" cy="16" r="3.5" fill="#3B82F6"/>
  <circle cx="18" cy="38" r="3.5" fill="#3B82F6"/>
  <circle cx="46" cy="38" r="3.5" fill="#3B82F6"/>
  <circle cx="32" cy="50" r="3.5" fill="#3B82F6"/>
  <circle cx="14" cy="24" r="3" fill="#60A5FA"/>
  <circle cx="50" cy="24" r="3" fill="#60A5FA"/>
  <!-- Network connections -->
  <line x1="32" y1="16" x2="18" y2="38" stroke="#93C5FD" stroke-width="1.5" opacity="0.8"/>
  <line x1="32" y1="16" x2="46" y2="38" stroke="#93C5FD" stroke-width="1.5" opacity="0.8"/>
  <line x1="18" y1="38" x2="46" y2="38" stroke="#93C5FD" stroke-width="1.5" opacity="0.8"/>
  <line x1="18" y1="38" x2="32" y2="50" stroke="#93C5FD" stroke-width="1.5" opacity="0.8"/>
  <line x1="46" y1="38" x2="32" y2="50" stroke="#93C5FD" stroke-width="1.5" opacity="0.8"/>
  <line x1="14" y1="24" x2="32" y2="16" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
  <line x1="50" y1="24" x2="32" y2="16" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
  <line x1="14" y1="24" x2="18" y2="38" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
  <line x1="50" y1="24" x2="46" y2="38" stroke="#93C5FD" stroke-width="1.2" opacity="0.6"/>
  <!-- Bright center node -->
  <circle cx="32" cy="32" r="4" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
</svg>
